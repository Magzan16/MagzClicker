name: Publish v1.5.0 release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build MagzClicker
        shell: pwsh
        run: .\build.ps1

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\MagzClicker.exe -Algorithm SHA256).Hash
          "$hash  MagzClicker.exe" | Set-Content -Encoding ascii .\MagzClicker-SHA256.txt

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.0 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v1.5.0 already exists."
            exit 0
          }

          @"
          ## MagzClicker 1.5.0

          First public release of MagzClicker for Windows.

          ### Highlights
          - Adjustable click interval from hours down to milliseconds
          - Left, right and middle mouse button support
          - Single and double click modes
          - Global Ctrl + Alt + S start/stop hotkey
          - Clicks at the current mouse position
          - Optional click limit with estimated run time
          - Visual click indicator
          - About dialog and F1 help
          - Portable executable — no installer required
          - No telemetry, analytics, ads or automatic updates

          Download **MagzClicker.exe** below. The SHA-256 checksum is included as a separate file.

          **Note:** This initial build is unsigned, so Windows SmartScreen may show a warning when you run it.
          "@ | Set-Content -Encoding utf8 .\release-notes.md

          gh release create v1.5.0 .\MagzClicker.exe .\MagzClicker-SHA256.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "MagzClicker 1.5.0" --notes-file .\release-notes.md
